name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spendtrack
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spendtrack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.27"

    - name: Install golangci-lint
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

    - name: Build
      run: go build ./...

    - name: Vet
      run: go vet ./...

    - name: Lint
      run: golangci-lint run ./...

    - name: Unit tests
      run: go test ./internal/... ./cmd/...

    - name: BDD suite
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/spendtrack?sslmode=disable
      run: go test ./features/...
